<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="Hackathon Surgeon">
  <defs>
    <style>
      .ink { fill: #0A0A0A; }
      .cut { fill: #FF3B30; }
      .keep { fill: #00D26A; }
      .defer { fill: #FFB800; }
      .accent { fill: #5E5CE6; }
      .mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="800" height="220" fill="#F5F5F5"/>
  <!-- Scalpel + cursor logo -->
  <g transform="translate(40, 40)">
    <rect x="0" y="40" width="120" height="6" fill="#0A0A0A"/>
    <polygon points="120,40 150,43 120,46" class="cut"/>
    <rect x="40" y="60" width="80" height="4" fill="#0A0A0A" opacity="0.6"/>
    <text x="0" y="100" class="mono ink" font-size="14">$ hackathon init</text>
  </g>
  <!-- Wordmark -->
  <text x="220" y="80" class="mono ink" font-size="48" font-weight="700">HACKATHON</text>
  <text x="220" y="130" class="mono cut" font-size="48" font-weight="700">SURGEON_</text>
  <!-- Tagline -->
  <text x="40" y="190" class="mono ink" font-size="18">Ship the demo, not the dream.</text>
  <!-- Color tokens demo -->
  <g transform="translate(540, 50)">
    <rect x="0" y="0" width="60" height="20" class="cut"/><text x="0" y="38" class="mono ink" font-size="11">CUT</text>
    <rect x="80" y="0" width="60" height="20" class="defer"/><text x="80" y="38" class="mono ink" font-size="11">DEFER</text>
    <rect x="160" y="0" width="60" height="20" class="keep"/><text x="160" y="38" class="mono ink" font-size="11">KEEP</text>
  </g>
</svg>
